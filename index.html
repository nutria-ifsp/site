<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/isotipo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf4" />
    <meta name="description" content="Nutria é uma rede social de alimentação e nutrição feita para a vida real: compartilhe refeições, acompanhe suas metas e encontre sua comunidade." />
    <title>Nutria — Alimentando uma vida melhor</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('nutria-theme')
        const useDark = savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = useDark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
